[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "montage-ai"
version = "0.1.0"
description = "AI-assisted professional video editing on ffmpeg (Claude, Gemini, Grok, Pinterest templates, CapCut/Premiere export)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
montage-ai = "montage_ai.cli:main"

[tool.setuptools]
packages = ["montage_ai"]

[tool.setuptools.package-data]
montage_ai = ["static/*", "templates/*"]
